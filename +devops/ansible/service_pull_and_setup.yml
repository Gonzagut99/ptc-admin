---
- name: Pull image and setup service environment
  hosts: all
  become: true

  vars:
    compose_dir: /opt/docker/compose/projects/ptc-production

  tasks:
    - name: Pull Docker image
      community.docker.docker_image:
        name: "{{ registry_image }}"
        source: pull
        force_source: true

    - name: Write version file
      ansible.builtin.copy:
        content: "{{ version }}"
        dest: "{{ compose_dir }}/.version.{{ project_service }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
